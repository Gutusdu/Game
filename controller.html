<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<title>CAGE LEGENDS Controller</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0f;touch-action:none;color:#fff;font-family:system-ui,sans-serif}
#screen{height:100dvh;width:100vw;display:flex;flex-direction:column;background:radial-gradient(ellipse at center,#17202a 0%,#080b0f 72%)}
#top{height:30px;flex:0 0 30px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-weight:900;letter-spacing:1px;font-size:12px;color:#f6f7f8}
#top span{color:#8c9ba8;font-size:10px;letter-spacing:0;font-weight:600}
#join{height:42px;flex:0 0 42px;display:flex;gap:7px;padding:4px 10px;justify-content:center}
#join input{width:125px;min-width:0;background:#111820;color:white;border:1px solid #3e4c58;border-radius:7px;text-align:center;text-transform:uppercase;letter-spacing:3px;font-weight:900}
#join button{background:#17212a;border:1px solid #53616d;color:white;border-radius:7px;padding:0 12px;font-size:11px;font-weight:900}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px 12px}
#layout{position:relative;width:min(100%,1500px);height:100%;max-height:calc(100dvh - 88px);aspect-ratio:1728/864;display:flex;align-items:center;justify-content:center}
#art{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hit{position:absolute;display:block;border:0;background:transparent;border-radius:50%;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}
 .hit:active{background:#ffffff10;outline:2px solid #ffffff20;outline-offset:-5px}
/* Touch-Zonen liegen exakt über den Symbolen in controller_art.png (1728x864). */
#jab{left:2.4%;top:49.5%;width:10.7%;height:21.5%}
#hook{left:14.4%;top:49.5%;width:10.7%;height:21.5%}
#upper{left:25.8%;top:49.5%;width:10.7%;height:21.5%}
#highkick{left:2.1%;top:72.2%;width:10.7%;height:21.5%}
#lowkick{left:14.2%;top:72.2%;width:10.7%;height:21.5%}
#ground{left:25.5%;top:72.2%;width:10.7%;height:21.5%}
#blockHigh,#blockLow{left:37.7%;width:12.1%;height:21.5%;border-radius:16px}
#blockHigh{top:49.5%}#blockLow{top:72.2%}
#joy{left:73.8%;top:50%;width:25.2%;height:45%;border-radius:50%}
#nub{position:absolute;left:28.5%;top:28.5%;width:43%;height:43%;border-radius:50%;background:transparent;pointer-events:none}
#statusline{height:16px;flex:0 0 16px;text-align:center;color:#788996;font-size:9px}
@media (orientation:portrait){
 #top{height:25px;flex-basis:25px}
 #join{height:38px;flex-basis:38px}
 #stage{padding:4px 6px 8px}
 #layout{width:100%;height:auto;aspect-ratio:1728/864;max-height:calc(100dvh - 88px)}
 #statusline{height:14px;flex-basis:14px}
}
@media (max-height:430px) and (orientation:landscape){
 #top{height:22px;flex-basis:22px}#join{height:30px;flex-basis:30px}
 #stage{padding:0 8px 2px}#layout{max-height:calc(100dvh - 66px)}
 #statusline{height:12px;flex-basis:12px}
}
</style>
</head>
<body>
<div id="screen">
 <header id="top">CAGE <span>LEGENDS · CONTROLLER</span><span id="status">NOT CONNECTED</span></header>
 <div id="join"><input id="code" maxlength="5" placeholder="ROOM CODE" autocomplete="off"><button id="connect">CONNECT</button></div>
 <main id="stage"><div id="layout">
  <img id="art" src="controller_art.png" alt="CAGE LEGENDS game controller">
  <button class="hit" id="jab" aria-label="Jab"></button>
  <button class="hit" id="hook" aria-label="Hook"></button>
  <button class="hit" id="upper" aria-label="Uppercut"></button>
  <button class="hit" id="highkick" aria-label="High kick"></button>
  <button class="hit" id="lowkick" aria-label="Low kick"></button>
  <button class="hit" id="ground" aria-label="Ground"></button>
  <button class="hit" id="blockHigh" aria-label="Block high"></button>
  <button class="hit" id="blockLow" aria-label="Block low"></button>
  <div class="hit" id="joy" aria-label="Movement joystick"><div id="nub"></div></div>
 </div></main>
 <div id="statusline">Hold block to guard · Landscape recommended</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="controller.js?v=20261015-controller-fix2"></script>
</body></html>
